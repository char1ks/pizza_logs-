<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f6b82"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:26px;font-weight:700;fill:#263746}
      .subtitle{font-size:14px;fill:#647887}
      .section{font-size:16px;font-weight:700;fill:#355b7a}
      .panel{fill:#fff;stroke:#b9c8d3;stroke-width:1.5}
      .service{fill:#6f97b4;stroke:#587a93;stroke-width:1.5}
      .system{fill:#2f5d82;stroke:#244964;stroke-width:1.5}
      .data{fill:#dce8f0;stroke:#8da7ba;stroke-width:1.5}
      .event{fill:#eef3f6;stroke:#8fa3b2;stroke-width:1.5}
      .cardTitle{font-size:15px;font-weight:700;fill:#fff}
      .darkTitle{font-size:15px;font-weight:700;fill:#31495a}
      .body{font-size:12px;fill:#eef5f9}
      .dark{font-size:12px;fill:#516878}
      .label{font-size:11px;fill:#506675}
      .eventText{font-size:12px;font-weight:700;fill:#415769}
      .line{stroke:#4f6b82;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .divider{stroke:#d5dfe6;stroke-width:1}
    </style>
  </defs>

  <rect width="1500" height="720" fill="#f4f6f8"/>
  <text x="750" y="40" text-anchor="middle" class="title">Основной EDA-поток</text>
  <text x="750" y="66" text-anchor="middle" class="subtitle">Жизненный цикл заказа через Outbox, Kafka и асинхронных consumer'ов</text>

  <rect x="40" y="95" width="1420" height="585" rx="8" class="panel"/>

  <!-- Order creation -->
  <text x="65" y="128" class="section">Создание заказа</text>

  <rect x="80" y="155" width="200" height="82" rx="7" class="event"/>
  <text x="180" y="187" text-anchor="middle" class="darkTitle">Пользователь</text>
  <text x="180" y="209" text-anchor="middle" class="dark">создаёт заказ</text>
  <text x="180" y="227" text-anchor="middle" class="dark">через Web UI</text>

  <rect x="405" y="145" width="245" height="102" rx="7" class="service"/>
  <text x="527" y="179" text-anchor="middle" class="cardTitle">Order Service</text>
  <text x="527" y="202" text-anchor="middle" class="body">создаёт заказ</text>
  <text x="527" y="220" text-anchor="middle" class="body">и Outbox-событие</text>
  <text x="527" y="238" text-anchor="middle" class="body">в одной транзакции</text>

  <rect x="775" y="155" width="230" height="82" rx="7" class="data"/>
  <text x="890" y="187" text-anchor="middle" class="darkTitle">PostgreSQL</text>
  <text x="890" y="209" text-anchor="middle" class="dark">orders</text>
  <text x="890" y="227" text-anchor="middle" class="dark">outbox_events</text>

  <rect x="1125" y="145" width="250" height="102" rx="7" class="service"/>
  <text x="1250" y="179" text-anchor="middle" class="cardTitle">Outbox Processor</text>
  <text x="1250" y="202" text-anchor="middle" class="body">читает события</text>
  <text x="1250" y="220" text-anchor="middle" class="body">из PostgreSQL</text>
  <text x="1250" y="238" text-anchor="middle" class="body">и публикует их в Kafka</text>

  <path d="M280 196 L405 196" class="line"/>
  <text x="342" y="181" text-anchor="middle" class="label">HTTP</text>
  <path d="M650 196 L775 196" class="line"/>
  <text x="712" y="181" text-anchor="middle" class="label">SQL</text>
  <path d="M1005 196 L1125 196" class="line"/>
  <text x="1065" y="181" text-anchor="middle" class="label">Outbox</text>

  <line x1="65" y1="275" x2="1435" y2="275" class="divider"/>

  <!-- Event distribution -->
  <text x="65" y="307" class="section">Публикация и распространение событий</text>

  <rect x="130" y="345" width="280" height="105" rx="7" class="system"/>
  <text x="270" y="379" text-anchor="middle" class="cardTitle">Apache Kafka</text>
  <text x="270" y="402" text-anchor="middle" class="body">центральная шина событий</text>
  <text x="270" y="425" text-anchor="middle" class="body">order-events • payment-events</text>

  <rect x="575" y="340" width="260" height="82" rx="7" class="service"/>
  <text x="705" y="374" text-anchor="middle" class="cardTitle">Payment Service</text>
  <text x="705" y="397" text-anchor="middle" class="body">получает OrderCreated</text>

  <rect x="575" y="442" width="260" height="72" rx="7" class="service"/>
  <text x="705" y="474" text-anchor="middle" class="cardTitle">Notification Service</text>
  <text x="705" y="496" text-anchor="middle" class="body">реагирует на события</text>

  <rect x="1010" y="350" width="270" height="105" rx="7" class="event"/>
  <text x="1145" y="384" text-anchor="middle" class="eventText">OrderCreated</text>
  <text x="1145" y="407" text-anchor="middle" class="dark">одно событие</text>
  <text x="1145" y="427" text-anchor="middle" class="dark">для нескольких consumer'ов</text>

  <path d="M1250 247 L1250 315 L270 315 L270 345" class="line"/>
  <text x="760" y="301" text-anchor="middle" class="label">publish → order-events</text>

  <path d="M410 375 L575 375" class="line"/>
  <text x="492" y="361" text-anchor="middle" class="label">consume</text>

  <path d="M410 425 L490 425 L490 478 L575 478" class="line"/>
  <text x="510" y="441" text-anchor="middle" class="label">consume</text>

  <path d="M835 381 L1010 381" class="line"/>
  <text x="922" y="367" text-anchor="middle" class="label">OrderCreated</text>

  <line x1="65" y1="530" x2="1435" y2="530" class="divider"/>

  <!-- Continuation -->
  <text x="65" y="560" class="section">Продолжение event chain</text>

  <rect x="575" y="580" width="240" height="68" rx="7" class="event"/>
  <text x="695" y="608" text-anchor="middle" class="eventText">PaymentCompleted</text>
  <text x="695" y="630" text-anchor="middle" class="dark">payment-events</text>

  <rect x="865" y="575" width="220" height="78" rx="7" class="service"/>
  <text x="975" y="608" text-anchor="middle" class="cardTitle">Order Service</text>
  <text x="975" y="631" text-anchor="middle" class="body">обновляет заказ</text>

  <rect x="1135" y="580" width="190" height="68" rx="7" class="event"/>
  <text x="1230" y="608" text-anchor="middle" class="eventText">OrderPaid</text>
  <text x="1230" y="630" text-anchor="middle" class="dark">новое событие</text>

  <path d="M705 422 L705 540 L695 540 L695 580" class="line"/>
  <text x="733" y="540" class="label">PaymentCompleted</text>

  <path d="M815 614 L865 614" class="line"/>
  <path d="M1085 614 L1135 614" class="line"/>

  <text x="750" y="672" text-anchor="middle" class="subtitle">Бизнес-состояние распространяется через события, а producer и consumer работают независимо.</text>
</svg>