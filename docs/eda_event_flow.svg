<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:26px;font-weight:700;fill:#263746}.sub{font-size:14px;fill:#647887}.section{font-size:16px;font-weight:700;fill:#355b7a}.panel{fill:#fff;stroke:#b9c8d3;stroke-width:1.5}.service{fill:#6f97b4;stroke:#587a93;stroke-width:1.5}.system{fill:#2f5d82;stroke:#244964;stroke-width:1.5}.data{fill:#dce8f0;stroke:#8da7ba;stroke-width:1.5}.event{fill:#eef3f6;stroke:#8fa3b2;stroke-width:1.5}.dt{font-size:14px;font-weight:700;fill:#31495a}.wt{font-size:15px;font-weight:700;fill:#fff}.w{font-size:12px;fill:#eef5f9}.d{font-size:12px;fill:#516878}.lab{font-size:11px;fill:#506675}.line{stroke:#4f6b82;stroke-width:2;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f6b82"/></marker></defs>
<rect width="1400" height="700" fill="#f4f6f8"/><text x="700" y="40" text-anchor="middle" class="title">Основной EDA-поток</text><text x="700" y="66" text-anchor="middle" class="sub">Жизненный цикл заказа через Outbox, Kafka и асинхронных consumer'ов</text>
<rect x="40" y="95" width="1320" height="555" rx="8" class="panel"/>
<text x="65" y="128" class="section">Создание заказа</text>
<rect x="70" y="155" width="180" height="78" rx="7" class="event"/><text x="160" y="185" text-anchor="middle" class="dt">Пользователь</text><text x="160" y="207" text-anchor="middle" class="d">создаёт заказ</text>
<rect x="315" y="145" width="210" height="98" rx="7" class="service"/><text x="420" y="178" text-anchor="middle" class="wt">Order Service</text><text x="420" y="201" text-anchor="middle" class="w">создаёт заказ</text><text x="420" y="221" text-anchor="middle" class="w">и Outbox-событие</text>
<rect x="590" y="155" width="220" height="78" rx="7" class="data"/><text x="700" y="185" text-anchor="middle" class="dt">PostgreSQL</text><text x="700" y="207" text-anchor="middle" class="d">orders + outbox_events</text>
<rect x="875" y="145" width="220" height="98" rx="7" class="service"/><text x="985" y="178" text-anchor="middle" class="wt">Outbox Processor</text><text x="985" y="201" text-anchor="middle" class="w">читает Outbox</text><text x="985" y="221" text-anchor="middle" class="w">и публикует событие</text>
<path d="M250 194L315 194" class="line"/><text x="282" y="181" text-anchor="middle" class="lab">HTTP</text><path d="M525 194L590 194" class="line"/><text x="557" y="181" text-anchor="middle" class="lab">SQL</text><path d="M810 194L875 194" class="line"/><text x="842" y="181" text-anchor="middle" class="lab">Outbox</text>
<line x1="65" y1="275" x2="1335" y2="275" stroke="#d5dfe6"/>
<text x="65" y="307" class="section">Публикация и распространение событий</text>
<rect x="330" y="345" width="250" height="105" rx="7" class="system"/><text x="455" y="380" text-anchor="middle" class="wt">Apache Kafka</text><text x="455" y="404" text-anchor="middle" class="w">центральная шина событий</text><text x="455" y="427" text-anchor="middle" class="w">order-events • payment-events</text>
<rect x="700" y="330" width="245" height="78" rx="7" class="service"/><text x="822" y="363" text-anchor="middle" class="wt">Payment Service</text><text x="822" y="386" text-anchor="middle" class="w">получает OrderCreated</text>
<rect x="700" y="435" width="245" height="78" rx="7" class="service"/><text x="822" y="468" text-anchor="middle" class="wt">Notification Service</text><text x="822" y="491" text-anchor="middle" class="w">реагирует на события</text>
<path d="M985 243L985 310L455 310L455 345" class="line"/><text x="720" y="302" text-anchor="middle" class="lab">publish → order-events</text>
<path d="M580 380L700 380" class="line"/><text x="640" y="366" text-anchor="middle" class="lab">OrderCreated</text>
<path d="M580 420L640 420L640 474L700 474" class="line"/><text x="642" y="440" class="lab">event</text>

<text x="65" y="560" class="section">Продолжение event chain</text>
<rect x="380" y="580" width="235" height="58" rx="7" class="event"/><text x="497" y="605" text-anchor="middle" class="dt">PaymentCompleted</text><text x="497" y="625" text-anchor="middle" class="d">payment-events</text>
<rect x="690" y="572" width="220" height="74" rx="7" class="service"/><text x="800" y="603" text-anchor="middle" class="wt">Order Service</text><text x="800" y="625" text-anchor="middle" class="w">обновляет заказ</text>
<rect x="985" y="580" width="200" height="58" rx="7" class="event"/><text x="1085" y="605" text-anchor="middle" class="dt">OrderPaid</text><text x="1085" y="625" text-anchor="middle" class="d">новое событие</text>
<!-- PaymentCompleted route: left of Notification Service, then into lower chain -->
<path d="M700 369L665 369L665 550L497 550L497 580" class="line"/>
<path d="M615 609L690 609" class="line"/><path d="M910 609L985 609" class="line"/>
<text x="1070" y="400" class="sub">Одно событие</text><text x="1070" y="421" class="d">может обрабатываться</text><text x="1070" y="440" class="d">несколькими consumer'ами</text>
<text x="700" y="675" text-anchor="middle" class="sub">Producer и consumer работают независимо по времени и скорости обработки.</text>
</svg>