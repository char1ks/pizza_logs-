<text x="45" y="987" class="sub">Ключевая последовательность событий</text>
<rect x="35" y="1000" width="1330" height="135" rx="8" class="box"/>
<rect x="60" y="1043" width="170" height="60" rx="7" class="comp"/><text x="145" y="1070" text-anchor="middle" class="dt">Создание заказа</text><text x="145" y="1089" text-anchor="middle" class="d">Order Service</text>
