<rect x="480" y="1043" width="170" height="60" rx="7" class="comp"/><text x="565" y="1070" text-anchor="middle" class="dt">Payment</text><text x="565" y="1089" text-anchor="middle" class="d">Payment Service</text>
<rect x="690" y="1043" width="180" height="60" rx="7" class="comp"/><text x="780" y="1070" text-anchor="middle" class="dt">PaymentCompleted</text><text x="780" y="1089" text-anchor="middle" class="d">payment-events</text>
