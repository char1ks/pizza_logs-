<rect width="1400" height="1180" fill="#f4f6f8"/>
<text x="700" y="38" text-anchor="middle" class="title">Pizza Order System — C4 Architecture</text>
<text x="700" y="63" text-anchor="middle" class="sub">EDA • Kafka • Outbox Pattern • Eventual Consistency</text>

<text x="45" y="105" class="level">Level 1 — System Context</text>
<rect x="35" y="120" width="1330" height="175" rx="8" class="box"/>
<rect x="80" y="175" width="210" height="75" rx="7" class="ext"/><text x="185" y="204" text-anchor="middle" class="dt">Customer</text><text x="185" y="226" text-anchor="middle" class="d">Создаёт заказ</text>
<rect x="545" y="160" width="310" height="105" rx="7" class="sys"/><text x="700" y="195" text-anchor="middle" class="wt">Pizza Order System</text><text x="700" y="218" text-anchor="middle" class="w">Распределённая EDA-система</text><text x="700" y="240" text-anchor="middle" class="w">Kafka • PostgreSQL • Microservices</text>
<rect x="1110" y="175" width="210" height="75" rx="7" class="ext"/><text x="1215" y="204" text-anchor="middle" class="dt">Payment Provider</text><text x="1215" y="226" text-anchor="middle" class="d">Внешняя система</text>
