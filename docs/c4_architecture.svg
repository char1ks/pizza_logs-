<path d="M855 230L1110 230" class="line"/><text x="982" y="218" text-anchor="middle" class="lab">платёж</text>

<text x="45" y="340" class="level">Level 2 — Container Diagram</text>
<text x="45" y="362" class="sub">Сервисы и инфраструктура EDA-системы</text>
<rect x="35" y="375" width="1330" height="305" rx="8" class="box"/>
<rect x="65" y="490" width="120" height="75" rx="7" class="ext"/><text x="125" y="520" text-anchor="middle" class="dt">Web UI</text><text x="125" y="542" text-anchor="middle" class="d">Каталог / заказ</text>
<rect x="210" y="475" width="110" height="105" rx="7" class="ext"/><text x="265" y="507" text-anchor="middle" class="dt">Nginx</text><text x="265" y="529" text-anchor="middle" class="d">API Gateway</text><text x="265" y="549" text-anchor="middle" class="d">routing</text>
<rect x="345" y="455" width="180" height="110" rx="7" class="svc"/><text x="435" y="489" text-anchor="middle" class="wt">Frontend Service</text><text x="435" y="512" text-anchor="middle" class="w">Каталог пицц</text><text x="435" y="532" text-anchor="middle" class="w">и запуск нагрузки</text><text x="435" y="552" text-anchor="middle" class="w">Python / Flask</text>
<rect x="555" y="455" width="180" height="110" rx="7" class="svc"/><text x="645" y="489" text-anchor="middle" class="wt">Order Service</text><text x="645" y="512" text-anchor="middle" class="w">Заказы</text><text x="645" y="532" text-anchor="middle" class="w">бизнес-события</text><text x="645" y="552" text-anchor="middle" class="w">Python / Flask</text>
<rect x="765" y="440" width="250" height="145" rx="7" class="sys"/><text x="890" y="476" text-anchor="middle" class="wt">Apache Kafka</text><text x="890" y="500" text-anchor="middle" class="w">центральная шина событий</text><text x="890" y="527" text-anchor="middle" class="w">order-events</text><text x="890" y="549" text-anchor="middle" class="w">payment-events</text><text x="890" y="571" text-anchor="middle" class="w">notification-events</text>
<rect x="1050" y="450" width="220" height="75" rx="7" class="svc"/><text x="1160" y="482" text-anchor="middle" class="wt">Payment Service</text><text x="1160" y="504" text-anchor="middle" class="w">Kafka Consumer</text>
<rect x="1050" y="550" width="220" height="75" rx="7" class="svc"/><text x="1160" y="582" text-anchor="middle" class="wt">Notification Service</text><text x="1160" y="604" text-anchor="middle" class="w">Kafka Consumer</text>
<rect x="345" y="610" width="390" height="55" rx="7" class="db"/><text x="540" y="632" text-anchor="middle" class="dt">PostgreSQL</text><text x="540" y="651" text-anchor="middle" class="d">frontend • orders • payments • notifications • outbox_events</text>
<rect x="785" y="610" width="230" height="55" rx="7" class="comp"/><text x="900" y="632" text-anchor="middle" class="dt">Outbox Processor</text><text x="900" y="651" text-anchor="middle" class="d">PostgreSQL → Kafka</text>

