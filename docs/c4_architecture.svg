<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1380" viewBox="0 0 1500 1380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f6b82"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:27px;font-weight:700;fill:#263746}
      .subtitle{font-size:14px;fill:#5f7282}
      .level{font-size:19px;font-weight:700;fill:#355b7a}
      .section{fill:#fff;stroke:#b9c8d3;stroke-width:1.5}
      .person{fill:#3f6f96;stroke:#315974;stroke-width:1.5}
      .system{fill:#2f5d82;stroke:#244964;stroke-width:1.5}
      .container{fill:#6f97b4;stroke:#567a94;stroke-width:1.5}
      .database{fill:#dce8f0;stroke:#8da7ba;stroke-width:1.5}
      .external{fill:#e9ecef;stroke:#9aa5ad;stroke-width:1.5}
      .component{fill:#8aabc0;stroke:#6b899d;stroke-width:1.5}
      .cardTitle{font-size:16px;font-weight:700;fill:#fff}
      .cardBody{font-size:12px;fill:#eef5f9}
      .darkBody{font-size:12px;fill:#435d70}
      .tech{font-size:11px;font-style:italic;fill:#edf4f8}
      .label{font-size:11px;fill:#415769}
      .event{font-size:11px;font-weight:700;fill:#415769}
      .flowStep{fill:#f7f9fb;stroke:#aebdca;stroke-width:1.5}
      .flowText{font-size:12px;font-weight:700;fill:#31495a}
      .note{font-size:11px;fill:#637685}
      .line{stroke:#4f6b82;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#8397a7;stroke-width:1.6;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1500" height="1380" fill="#f4f6f8"/>
  <text x="750" y="42" text-anchor="middle" class="title">Pizza Order System — C4 Architecture</text>
  <text x="750" y="68" text-anchor="middle" class="subtitle">Event-Driven Architecture • Kafka • Outbox Pattern • Eventual Consistency</text>

  <!-- LEVEL 1 -->
  <text x="55" y="112" class="level">Level 1 — System Context</text>
  <rect x="40" y="130" width="1420" height="205" rx="8" class="section"/>

  <rect x="90" y="195" width="240" height="90" rx="7" class="person"/>
  <text x="210" y="228" text-anchor="middle" class="cardTitle">Customer</text>
  <text x="210" y="251" text-anchor="middle" class="cardBody">Создаёт и отслеживает</text>
  <text x="210" y="269" text-anchor="middle" class="cardBody">заказ пиццы</text>

  <rect x="610" y="180" width="320" height="120" rx="7" class="system"/>
  <text x="770" y="218" text-anchor="middle" class="cardTitle">Pizza Order System</text>
  <text x="770" y="242" text-anchor="middle" class="cardBody">Распределённая система</text>
  <text x="770" y="262" text-anchor="middle" class="cardBody">с Event-Driven Architecture</text>
  <text x="770" y="282" text-anchor="middle" class="cardBody">Kafka • PostgreSQL • Microservices</text>

  <rect x="1165" y="195" width="245" height="90" rx="7" class="external"/>
  <text x="1287" y="228" text-anchor="middle" class="darkBody" font-weight="700">Payment Provider</text>
  <text x="1287" y="251" text-anchor="middle" class="darkBody">Внешняя платёжная</text>
  <text x="1287" y="269" text-anchor="middle" class="darkBody">система / mock</text>

  <path d="M330 240 L610 240" class="line"/>
  <text x="470" y="226" text-anchor="middle" class="label">создаёт заказ</text>

  <path d="M930 255 L1165 255" class="line"/>
  <text x="1047" y="242" text-anchor="middle" class="label">обрабатывает платежи</text>

  <!-- LEVEL 2 -->
  <text x="55" y="380" class="level">Level 2 — Container Diagram</text>
  <text x="55" y="403" class="subtitle">Основные контейнеры и связи EDA-системы</text>
  <rect x="40" y="420" width="1420" height="335" rx="8" class="section"/>

  <!-- Web UI -->
  <rect x="70" y="500" width="140" height="80" rx="7" class="external"/>
  <text x="140" y="531" text-anchor="middle" class="darkBody" font-weight="700">Web UI</text>
  <text x="140" y="553" text-anchor="middle" class="darkBody">Каталог и заказ</text>
  <text x="140" y="572" text-anchor="middle" class="darkBody">HTML / JavaScript</text>

  <!-- Nginx -->
  <rect x="235" y="485" width="125" height="110" rx="7" class="external"/>
  <text x="297" y="521" text-anchor="middle" class="darkBody" font-weight="700">Nginx</text>
  <text x="297" y="544" text-anchor="middle" class="darkBody">API Gateway</text>
  <text x="297" y="567" text-anchor="middle" class="darkBody">HTTP routing</text>

  <!-- Frontend Service -->
  <rect x="395" y="470" width="190" height="105" rx="7" class="container"/>
  <text x="490" y="504" text-anchor="middle" class="cardTitle">Frontend Service</text>
  <text x="490" y="527" text-anchor="middle" class="cardBody">Каталог пицц</text>
  <text x="490" y="547" text-anchor="middle" class="cardBody">и запуск нагрузки</text>
  <text x="490" y="567" text-anchor="middle" class="tech">Python / Flask</text>

  <!-- Order Service -->
  <rect x="620" y="470" width="190" height="105" rx="7" class="container"/>
  <text x="715" y="504" text-anchor="middle" class="cardTitle">Order Service</text>
  <text x="715" y="527" text-anchor="middle" class="cardBody">Заказы и состояние</text>
  <text x="715" y="547" text-anchor="middle" class="cardBody">бизнес-события</text>
  <text x="715" y="567" text-anchor="middle" class="tech">Python / Flask</text>

  <!-- Kafka -->
  <rect x="900" y="450" width="270" height="150" rx="7" class="system"/>
  <text x="1035" y="488" text-anchor="middle" class="cardTitle">Apache Kafka</text>
  <text x="1035" y="512" text-anchor="middle" class="cardBody">Центральная шина событий</text>
  <text x="1035" y="542" text-anchor="middle" class="cardBody">order-events</text>
  <text x="1035" y="563" text-anchor="middle" class="cardBody">payment-events</text>
  <text x="1035" y="584" text-anchor="middle" class="cardBody">notification-events • dlq-events</text>

  <!-- Payment Service -->
  <rect x="1215" y="455" width="200" height="80" rx="7" class="container"/>
  <text x="1315" y="488" text-anchor="middle" class="cardTitle">Payment Service</text>
  <text x="1315" y="511" text-anchor="middle" class="cardBody">Обработка платежей</text>
  <text x="1315" y="530" text-anchor="middle" class="tech">Kafka Consumer</text>

  <!-- Notification Service -->
  <rect x="1215" y="555" width="200" height="80" rx="7" class="container"/>
  <text x="1315" y="588" text-anchor="middle" class="cardTitle">Notification Service</text>
  <text x="1315" y="611" text-anchor="middle" class="cardBody">Уведомления</text>
  <text x="1315" y="630" text-anchor="middle" class="tech">Kafka Consumer</text>

  <!-- Outbox Processor -->
  <rect x="900" y="625" width="270" height="55" rx="7" class="component"/>
  <text x="1035" y="648" text-anchor="middle" class="cardTitle">Outbox Processor</text>
  <text x="1035" y="667" text-anchor="middle" class="body">публикует события из PostgreSQL в Kafka</text>

  <!-- PostgreSQL -->
  <rect x="395" y="685" width="775" height="45" rx="7" class="database"/>
  <text x="782" y="705" text-anchor="middle" class="darkBody" font-weight="700">PostgreSQL — frontend • orders • payments • notifications • outbox_events</text>
  <text x="782" y="721" text-anchor="middle" class="note">единая БД стенда с отдельными схемами</text>

  <!-- Request relationships -->
  <path d="M210 540 L235 540" class="line"/>
  <text x="222" y="526" text-anchor="middle" class="label">HTTP</text>

  <path d="M360 535 L395 535" class="line"/>
  <text x="378" y="521" text-anchor="middle" class="label">/menu</text>

  <path d="M360 505 L380 505 L380 445 L715 445 L715 470" class="line"/>
  <text x="545" y="437" text-anchor="middle" class="label">/orders</text>

  <!-- Database relationships -->
  <path d="M490 575 L490 685" class="line"/>
  <text x="508" y="635" class="label">SQL</text>

  <path d="M690 575 L690 685" class="line"/>
  <text x="708" y="640" class="label">SQL</text>

  <!-- Outbox relationship -->
  <path d="M760 575 L760 650 L900 650" class="line"/>
  <text x="815" y="638" text-anchor="middle" class="label">Outbox event</text>

  <path d="M1035 625 L1035 600" class="line"/>

  <!-- Kafka consumers -->
  <path d="M1170 495 L1215 495" class="line"/>
  <text x="1192" y="481" text-anchor="middle" class="label">OrderCreated</text>

  <path d="M1170 595 L1215 595" class="line"/>
  <text x="1192" y="581" text-anchor="middle" class="label">events</text>

  <!-- PaymentCompleted back to Order Service -->
  <path d="M900 555 L850 555 L850 555 L810 555" class="line"/>
  <text x="855" y="545" text-anchor="middle" class="label">PaymentCompleted</text>

  <!-- Frontend role -->
  <text x="65" y="625" class="note">Frontend Service — каталог и API для запуска нагрузочного теста.</text>

  <!-- LEVEL 3 -->
  <text x="55" y="780" class="level">Level 3 — Component Diagram: Order Service</text>
  <text x="55" y="803" class="subtitle">Внутреннее устройство сервиса, отвечающего за заказы и публикацию событий</text>
  <rect x="40" y="820" width="1420" height="220" rx="8" class="section"/>

  <rect x="90" y="875" width="235" height="100" rx="7" class="component"/>
  <text x="207" y="910" text-anchor="middle" class="cardTitle">Order Controller</text>
  <text x="207" y="934" text-anchor="middle" class="cardBody">REST API</text>
  <text x="207" y="954" text-anchor="middle" class="tech">Flask Routes</text>

  <rect x="380" y="875" width="235" height="100" rx="7" class="component"/>
  <text x="497" y="910" text-anchor="middle" class="cardTitle">Order Service</text>
  <text x="497" y="934" text-anchor="middle" class="cardBody">Бизнес-логика заказа</text>
  <text x="497" y="954" text-anchor="middle" class="tech">Python</text>

  <rect x="670" y="875" width="235" height="100" rx="7" class="component"/>
  <text x="787" y="910" text-anchor="middle" class="cardTitle">Outbox Processor</text>
  <text x="787" y="934" text-anchor="middle" class="cardBody">Публикация событий</text>
  <text x="787" y="954" text-anchor="middle" class="tech">Background process</text>

  <rect x="960" y="875" width="235" height="100" rx="7" class="component"/>
  <text x="1077" y="910" text-anchor="middle" class="cardTitle">Event Consumer</text>
  <text x="1077" y="934" text-anchor="middle" class="cardBody">Обработка Kafka events</text>
  <text x="1077" y="954" text-anchor="middle" class="tech">Kafka Consumer</text>

  <rect x="1250" y="875" width="155" height="100" rx="7" class="database"/>
  <text x="1327" y="910" text-anchor="middle" class="darkBody" font-weight="700">Repository</text>
  <text x="1327" y="934" text-anchor="middle" class="darkBody">PostgreSQL</text>
  <text x="1327" y="954" text-anchor="middle" class="darkBody">orders / outbox</text>

  <path d="M325 925 L380 925" class="line"/>
  <path d="M615 925 L670 925" class="line"/>
  <path d="M905 925 L960 925" class="line"/>
  <path d="M497 975 L497 1015 L1327 1015 L1327 975" class="dashed"/>
  <text x="910" y="1032" text-anchor="middle" class="label">доступ к данным</text>

  <!-- EVENT FLOW -->
  <text x="55" y="1090" class="level">Event Flow — обработка заказа</text>
  <text x="55" y="1113" class="subtitle">Последовательность ключевых событий EDA</text>
  <rect x="40" y="1130" width="1420" height="185" rx="8" class="section"/>

  <rect x="70" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="150" y="1212" text-anchor="middle" class="flowText">1. Создание заказа</text>
  <text x="150" y="1233" text-anchor="middle" class="note">Order Service</text>

  <rect x="270" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="350" y="1212" text-anchor="middle" class="flowText">2. OrderCreated</text>
  <text x="350" y="1233" text-anchor="middle" class="note">order-events</text>

  <rect x="470" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="550" y="1212" text-anchor="middle" class="flowText">3. Payment</text>
  <text x="550" y="1233" text-anchor="middle" class="note">Payment Service</text>

  <rect x="670" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="750" y="1212" text-anchor="middle" class="flowText">4. PaymentCompleted</text>
  <text x="750" y="1233" text-anchor="middle" class="note">payment-events</text>

  <rect x="870" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="950" y="1212" text-anchor="middle" class="flowText">5. OrderPaid</text>
  <text x="950" y="1233" text-anchor="middle" class="note">Order Service</text>

  <rect x="1070" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="1150" y="1212" text-anchor="middle" class="flowText">6. Notification</text>
  <text x="1150" y="1233" text-anchor="middle" class="note">Notification Service</text>

  <rect x="1270" y="1185" width="160" height="70" rx="7" class="flowStep"/>
  <text x="1350" y="1212" text-anchor="middle" class="flowText">7. Persist state</text>
  <text x="1350" y="1233" text-anchor="middle" class="note">PostgreSQL</text>

  <path d="M230 1220 L270 1220" class="line"/>
  <path d="M430 1220 L470 1220" class="line"/>
  <path d="M630 1220 L670 1220" class="line"/>
  <path d="M830 1220 L870 1220" class="line"/>
  <path d="M1030 1220 L1070 1220" class="line"/>
  <path d="M1230 1220 L1270 1220" class="line"/>

  <text x="750" y="1285" text-anchor="middle" class="subtitle">Ключевой принцип: бизнес-изменения распространяются через события, а не через длинную цепочку синхронных вызовов.</text>
</svg>