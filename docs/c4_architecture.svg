<text x="45" y="747" class="sub">Внутренние компоненты Order Service</text>
<rect x="35" y="760" width="1330" height="170" rx="8" class="box"/>
<rect x="70" y="810" width="215" height="75" rx="7" class="comp"/><text x="177" y="839" text-anchor="middle" class="dt">Order Controller</text><text x="177" y="860" text-anchor="middle" class="d">REST API</text>
<rect x="345" y="810" width="215" height="75" rx="7" class="comp"/><text x="452" y="839" text-anchor="middle" class="dt">Order Service</text><text x="452" y="860" text-anchor="middle" class="d">Бизнес-логика</text>
<rect x="620" y="810" width="215" height="75" rx="7" class="comp"/><text x="727" y="839" text-anchor="middle" class="dt">Outbox Processor</text><text x="727" y="860" text-anchor="middle" class="d">Публикация событий</text>
