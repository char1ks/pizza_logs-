<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2f5f8f"/>
    </marker>
    <marker id="arrowDark" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1d4268"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill:#17324d; }
      .subtitle { font-size: 15px; fill:#5b7187; }
      .section { font-size: 20px; font-weight:700; fill:#1e4f7a; }
      .card-title { font-size: 17px; font-weight:700; fill:#17324d; }
      .card-body { font-size: 13px; fill:#49657d; }
      .tag { font-size: 11px; font-weight:700; fill:#2d5a83; }
      .label { font-size: 12px; font-weight:700; fill:#355a78; }
      .small { font-size: 11px; fill:#647d93; }
      .event { font-size: 12px; font-weight:700; fill:#8a4b16; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>

  <text x="800" y="52" text-anchor="middle" class="title">Pizza Order System — C4 Architecture</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Event-Driven Architecture • Kafka • Outbox Pattern • Eventual Consistency</text>

  <!-- Level 1 -->
  <text x="80" y="125" class="section">Level 1 — System Context</text>
  <rect x="60" y="145" width="1480" height="220" rx="18" fill="#ffffff" stroke="#c9d8e6" stroke-width="2"/>

  <!-- Context nodes -->
  <g filter="url(#shadow)">
    <rect x="105" y="205" width="240" height="100" rx="14" fill="#285b88"/>
    <text x="225" y="238" text-anchor="middle" fill="#fff" class="card-title">👤 Пользователь</text>
    <text x="225" y="262" text-anchor="middle" fill="#e9f2fb" class="card-body">Создаёт и отслеживает</text>
    <text x="225" y="281" text-anchor="middle" fill="#e9f2fb" class="card-body">заказ пиццы</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="190" width="300" height="130" rx="16" fill="#1769aa"/>
    <text x="830" y="230" text-anchor="middle" fill="#fff" class="card-title">🍕 Pizza Order System</text>
    <text x="830" y="255" text-anchor="middle" fill="#edf6ff" class="card-body">Распределённая система</text>
    <text x="830" y="276" text-anchor="middle" fill="#edf6ff" class="card-body">с Event-Driven Architecture</text>
    <text x="830" y="301" text-anchor="middle" fill="#d8ebfb" class="tag">EDA / Kafka / PostgreSQL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1245" y="205" width="240" height="100" rx="14" fill="#6f7d8a"/>
    <text x="1365" y="238" text-anchor="middle" fill="#fff" class="card-title">💳 Payment Provider</text>
    <text x="1365" y="263" text-anchor="middle" fill="#edf1f4" class="card-body">Внешняя платёжная</text>
    <text x="1365" y="282" text-anchor="middle" fill="#edf1f4" class="card-body">система / mock</text>
  </g>

  <!-- Context relationships: lines separated from text -->
  <path d="M345 255 L680 255" stroke="#2f5f8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="224" width="175" height="25" rx="8" fill="#fff"/>
  <text x="517" y="241" text-anchor="middle" class="label">создаёт заказ</text>

  <path d="M980 275 L1245 275" stroke="#2f5f8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1025" y="286" width="175" height="25" rx="8" fill="#fff"/>
  <text x="1112" y="303" text-anchor="middle" class="label">обрабатывает платежи</text>

  <!-- Level 2 -->
  <text x="80" y="410" class="section">Level 2 — Container Diagram</text>
  <text x="80" y="435" class="subtitle">Основная EDA-архитектура: сервисы взаимодействуют через события Kafka</text>

  <rect x="60" y="455" width="1480" height="560" rx="18" fill="#ffffff" stroke="#c9d8e6" stroke-width="2"/>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="95" y="650" width="185" height="105" rx="14" fill="#6f7d8a"/>
    <text x="187" y="684" text-anchor="middle" fill="#fff" class="card-title">Web UI</text>
    <text x="187" y="709" text-anchor="middle" fill="#eef3f6" class="card-body">Каталог и оформление</text>
    <text x="187" y="730" text-anchor="middle" fill="#dce6ed" class="tag">HTML / JavaScript</text>
  </g>

  <!-- Order -->
  <g filter="url(#shadow)">
    <rect x="365" y="610" width="230" height="150" rx="16" fill="#2f73ad"/>
    <text x="480" y="645" text-anchor="middle" fill="#fff" class="card-title">📦 Order Service</text>
    <text x="480" y="671" text-anchor="middle" fill="#edf6ff" class="card-body">Заказы и их состояние</text>
    <text x="480" y="694" text-anchor="middle" fill="#dcefff" class="card-body">создаёт бизнес-события</text>
    <rect x="405" y="716" width="150" height="25" rx="8" fill="#d9ecfb"/>
    <text x="480" y="733" text-anchor="middle" class="tag">Python / Flask</text>
  </g>

  <!-- Outbox -->
  <g filter="url(#shadow)">
    <rect x="365" y="830" width="230" height="105" rx="16" fill="#2b6a8d"/>
    <text x="480" y="862" text-anchor="middle" fill="#fff" class="card-title">Outbox Processor</text>
    <text x="480" y="887" text-anchor="middle" fill="#edf8ff" class="card-body">Публикует события</text>
    <text x="480" y="907" text-anchor="middle" fill="#d5eaf7" class="tag">PostgreSQL → Kafka</text>
  </g>

  <!-- Kafka -->
  <g filter="url(#shadow)">
    <rect x="735" y="600" width="260" height="180" rx="18" fill="#b56b22"/>
    <text x="865" y="640" text-anchor="middle" fill="#fff" class="card-title">🔄 Apache Kafka</text>
    <text x="865" y="666" text-anchor="middle" fill="#fff4e8" class="card-body">Центральная шина событий</text>
    <rect x="770" y="695" width="190" height="27" rx="9" fill="#ffe6c9"/>
    <text x="865" y="713" text-anchor="middle" class="event">order-events</text>
    <rect x="770" y="730" width="190" height="27" rx="9" fill="#ffe6c9"/>
    <text x="865" y="748" text-anchor="middle" class="event">payment-events</text>
  </g>

  <!-- Payment -->
  <g filter="url(#shadow)">
    <rect x="1130" y="530" width="240" height="135" rx="16" fill="#3c7d63"/>
    <text x="1250" y="566" text-anchor="middle" fill="#fff" class="card-title">💳 Payment Service</text>
    <text x="1250" y="592" text-anchor="middle" fill="#eefaf4" class="card-body">Обработка оплаты</text>
    <text x="1250" y="616" text-anchor="middle" fill="#dff2e8" class="tag">Kafka Consumer</text>
  </g>

  <!-- Notification -->
  <g filter="url(#shadow)">
    <rect x="1130" y="730" width="240" height="135" rx="16" fill="#5566a1"/>
    <text x="1250" y="766" text-anchor="middle" fill="#fff" class="card-title">📧 Notification Service</text>
    <text x="1250" y="792" text-anchor="middle" fill="#eef1ff" class="card-body">Обработка уведомлений</text>
    <text x="1250" y="816" text-anchor="middle" fill="#e0e6ff" class="tag">Kafka Consumer</text>
  </g>

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="670" y="835" width="330" height="105" rx="16" fill="#527a9f"/>
    <text x="835" y="867" text-anchor="middle" fill="#fff" class="card-title">🗄 PostgreSQL</text>
    <text x="835" y="892" text-anchor="middle" fill="#edf5fb" class="card-body">orders • payments • notifications</text>
    <text x="835" y="915" text-anchor="middle" fill="#dbeaf6" class="tag">Бизнес-данные + Outbox</text>
  </g>

  <!-- Main arrows -->
  <path d="M280 702 L365 702" stroke="#2f5f8f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="292" y="670" width="62" height="24" rx="7" fill="#fff"/>
  <text x="323" y="687" text-anchor="middle" class="label">HTTP</text>

  <path d="M480 760 L480 830" stroke="#1d4268" stroke-width="3" fill="none" marker-end="url(#arrowDark)"/>
  <rect x="498" y="778" width="68" height="24" rx="7" fill="#fff"/>
  <text x="532" y="795" text-anchor="middle" class="label">Outbox</text>

  <path d="M595 882 L670 882" stroke="#1d4268" stroke-width="3" fill="none" marker-end="url(#arrowDark)"/>
  <rect x="605" y="850" width="58" height="24" rx="7" fill="#fff"/>
  <text x="634" y="867" text-anchor="middle" class="label">SQL</text>

  <path d="M595 702 L735 702" stroke="#a45f1d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="616" y="669" width="91" height="24" rx="7" fill="#fff"/>
  <text x="662" y="686" text-anchor="middle" class="event">events</text>

  <path d="M995 650 C1050 630 1080 600 1130 598" stroke="#a45f1d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1015" y="602" width="92" height="24" rx="7" fill="#fff"/>
  <text x="1061" y="619" text-anchor="middle" class="event">OrderCreated</text>

  <path d="M995 730 C1050 750 1085 780 1130 790" stroke="#a45f1d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1005" y="755" width="100" height="24" rx="7" fill="#fff"/>
  <text x="1055" y="772" text-anchor="middle" class="event">events</text>

  <path d="M1130 635 C1075 660 1045 686 995 690" stroke="#3c7d63" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1015" y="660" width="120" height="24" rx="7" fill="#fff"/>
  <text x="1075" y="677" text-anchor="middle" class="event">PaymentCompleted</text>

  <path d="M1250 665 L1250 730" stroke="#5566a1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1265" y="682" width="74" height="24" rx="7" fill="#fff"/>
  <text x="1302" y="699" text-anchor="middle" class="event">notify</text>

  <path d="M1130 815 C1075 850 1050 875 1000 885" stroke="#5566a1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1010" y="838" width="74" height="24" rx="7" fill="#fff"/>
  <text x="1047" y="855" text-anchor="middle" class="label">SQL</text>

  <!-- External payment provider -->
  <g filter="url(#shadow)">
    <rect x="1350" y="905" width="145" height="80" rx="14" fill="#7c8792"/>
    <text x="1422" y="935" text-anchor="middle" fill="#fff" class="card-title" style="font-size:14px">Payment Mock</text>
    <text x="1422" y="958" text-anchor="middle" fill="#edf1f4" class="small">внешний сервис</text>
  </g>
  <path d="M1370 625 C1430 660 1435 800 1425 905" stroke="#6f7d8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="1410" y="770" width="100" height="24" rx="7" fill="#fff"/>
  <text x="1460" y="787" text-anchor="middle" class="label">HTTP</text>

  <!-- Supporting note -->
  <rect x="95" y="805" width="185" height="170" rx="14" fill="#f4f8fc" stroke="#c8d8e7"/>
  <text x="187" y="835" text-anchor="middle" class="card-title" style="font-size:15px">EDA-идея</text>
  <text x="187" y="862" text-anchor="middle" class="small">Сервисы не образуют</text>
  <text x="187" y="880" text-anchor="middle" class="small">длинную синхронную</text>
  <text x="187" y="898" text-anchor="middle" class="small">цепочку.</text>
  <text x="187" y="928" text-anchor="middle" class="small">Они публикуют и</text>
  <text x="187" y="946" text-anchor="middle" class="small">обрабатывают события</text>
  <text x="187" y="964" text-anchor="middle" class="small">асинхронно.</text>

  <!-- Legend -->
  <rect x="1010" y="945" width="320" height="55" rx="12" fill="#f9fbfd" stroke="#c8d8e7"/>
  <text x="1030" y="968" class="small">Синие — сервисы</text>
  <text x="1150" y="968" class="small">Оранжевый — Kafka</text>
  <text x="1280" y="968" class="small">Серый — внешние системы</text>
  <text x="1030" y="989" class="small">Стрелки показывают направление взаимодействия</text>

  <!-- Footer -->
  <text x="800" y="1065" text-anchor="middle" class="subtitle">C4 overview • Level 1 + Level 2 • фокус на Event-Driven Architecture</text>
</svg>