apiVersion: 1

providers:
  - name: 'Главная'
    orgId: 1
    folder: 'Главное'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/overview

  - name: 'Kafka'
    orgId: 1
    folder: 'Kafka'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/kafka

  - name: 'Сервисы'
    orgId: 1
    folder: 'Сервисы'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/services

  - name: 'База данных'
    orgId: 1
    folder: 'База данных'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/database

  - name: 'Сервер'
    orgId: 1
    folder: 'Сервер'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure
