apiVersion: 1

# Each provider must own a disjoint set of dashboard files (no shared path),
# otherwise Grafana reports: "Cannot change resource manager".

providers:
  - name: 'Pizza System Dashboards'
    orgId: 1
    folder: 'Pizza Order System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/pizza-system

  - name: 'Monitoring Methodologies'
    orgId: 1
    folder: 'Monitoring Methodologies'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/methodologies
